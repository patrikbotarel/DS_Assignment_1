###############################################
### ENV FILE USE ###
###############################################
spring.config.import=optional:file:.env[.properties]


###############################################
### DATABASE CONNECTIVITY CONFIGURATIONS ###
###############################################
database.ip = ${DB_HOST:localhost}
database.port = ${DB_PORT:3306}
database.user = ${DB_USER:user}
database.password = ${DB_PASSWORD:user}
database.name = ${DB_NAME:energy_db}

spring.datasource.url = jdbc:mysql://${database.ip}:${database.port}/${database.name}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username = ${database.user}
spring.datasource.password = ${database.password}


###############################################
### JPA / HIBERNATE ###
###############################################
# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto = update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect


###############################################
### DEVICE MICROSERVICE SYNCHRONIZATION ###
###############################################
device.service.url = ${DEVICE_SERVICE_URL:http://localhost:8081/device}
device.service.sync.enabled = ${DEVICE_SERVICE_SYNC_ENABLED:true}


###############################################
### AUTH MICROSERVICE SYNCHRONIZATION ###
###############################################
auth.service.url = ${AUTH_SERVICE_URL:http://auth-service:8082/auth}
auth.service.sync.enabled = ${AUTH_SERVICE_SYNC_ENABLED:true}



###############################################
### SWAGGER / OPENAPI CONFIGURATION ###
###############################################
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.api-docs.data-rest.enabled=false
springdoc.api-docs.hateoas.enabled=false
springdoc.show-actuator=false


###############################################
### LOGGING CONFIGURATIONS ###
###############################################
logging.level.root=info
logging.level.org.springframework=info
logging.level.ro.tuc=debug


###############################################
### EMBEDDED TOMCAT CONFIGURATIONS ###
###############################################
server.port=${PORT:8080}
server.servlet.context-path=${SERVER_CONTEXT_PATH:}
