services:
  mysql-device-db:
    image: mysql:8.0
    container_name: mysql-device-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-device_db}
      MYSQL_USER: ${DB_USER:-device_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-device_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-device_root_password}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql-device-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks:
      - demo_net

  device-service:
    build: .
    container_name: device-service
    restart: unless-stopped
    ports:
      - "${PORT:-8081}:8081"
    environment:
      DB_HOST: mysql-device-db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-device_db}
      DB_USER: ${DB_USER:-device_user}
      DB_PASSWORD: ${DB_PASSWORD:-device_password}
      PORT: 8081
    depends_on:
      mysql-device-db:
        condition: service_healthy
    networks:
      - demo_net

volumes:
  mysql-device-data:

networks:
  demo_net:
    name: demo_net
